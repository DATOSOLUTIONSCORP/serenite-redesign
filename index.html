"cells":["1 Session of Attiva = $5,000","$5,000.00"]},{"t":"tr","cells":["PLUS","12 IV therapy for the year = $ 3,600","$3,600.00"]},{"t":"tr","cells":["PLUS","12 sessions of Body sculpting (EMS) = $4,800","$4,800.00"]},{"t":"tr","cells":["$13,400.00"]},{"t":"tr","cells":["Annual DIAMOND Membership Package 6"]},{"t":"tr","cells":["12 Sessions of Laser Hair Removal = $7,200","$7,200.00"]},{"t":"tr","cells":["PLUS","12 sessions of Body sculpting (EMS) = $4,800","$4,800.00"]},{"t":"tr","cells":["$12,000.00"]},{"t":"tr","cells":["Annual DIAMOND Membership Package 7"]},{"t":"tr","cells":["6 sessions of Microneedling = $4,200","$4,200.00"]},{"t":"tr","cells":["PLUS","10 sessions of Lumecca = $ 3,000","$3,000.00"]},{"t":"tr","cells":["PLUS","12 sessions of Facial = $ 3,000","$3,000.00"]},{"t":"tr","cells":["PLUS","6 IV therapy for the year = $ 1,800","$1,800.00"]},{"t":"tr","cells":["$12,000.00"]},{"t":"tr","cells":["Annual DIAMOND Membership Package 8"]},{"t":"tr","cells":["12 sessions of Facial = $ 3,000","$3,000.00"]},{"t":"tr","cells":["PLUS","12 sessions of NS Face Lift = $ 4,800","12 IV therapy for the year = $ 3,600"]},{"t":"tr","cells":["PLUS","$4,800.00","$3,600.00"]},{"t":"tr","cells":["$11,400.00"]}]},{"h":"Reach Us Now","parts":[{"t":"p","text":"Contact us today to experience our personalized and holistic approach to wellness. Your well-being is our priority!"}]}]},"news":{"title":"News","group":"info","secs":[{"h":"Serenite Wellness Medicine Launches Cutting-Edge Corporate Wellness Services","parts":[{"t":"p","text":"News Provided By Maps Guaranteed July 31, 2024, 14:30 GMT"},{"t":"p","text":"ONTARIO, CA, UNITED STATES, July 31, 2024 /EINPresswire.com/, Serenite Wellness Medicine proudly announces the launch of its innovative Corporate Wellness Services, designed to revolutionize workplace health and productivity. This comprehensive program offers businesses a unique opportunity to invest in the well-being of their employees, fostering a healthier, happier, and more productive workforce."},{"t":"p","text":"Key Features of Serenite’s Corporate Wellness Services:"},{"t":"p","text":"Holistic Wellness Strategy: Serenite’s Corporate Wellness Program integrates advanced medical technology, the latest pharmaceuticals, natural nutraceuticals, lifestyle modifications, healthy nutrition, monitored physical activity, personalized coaching, and mental health strategies to provide a well-rounded approach."},{"t":"p","text":"Expert Guidance: Led by Dr. Heidi, MD, and Ador Mansat, DNP, FNP-C, MBA, BSChE, the team at Serenite brings unparalleled experience and knowledge in aesthetic, rejuvenative, and longevity-focused health strategies."},{"t":"p","text":"Virtual and Onsite Options: To accommodate the diverse needs of businesses, both virtual appointments and onsite wellness services are offered, ensuring accessibility and convenience for all employees."},{"t":"p","text":"Customized Health Plans: Personalized health assessments and tailored wellness plans address the unique needs of each employee, promoting optimal health and well-being."},{"t":"p","text":"Comprehensive Support: Programs include regular health screenings, stress management workshops, and ongoing support to help employees maintain a balanced and healthy lifestyle."},{"t":"p","text":"Benefits of Corporate Wellness Services"},{"t":"p","text":"Serenite Wellness Medicine’s Corporate Wellness Services significantly enhance productivity, reduce healthcare costs, and boost employee morale. By proactively addressing health issues and promoting wellness, companies experience fewer sick days and lower absenteeism, ensuring smoother operations. Moreover, offering comprehensive wellness services attracts top talent and retains valuable employees, fostering a supportive work environment and ultimately driving improved business performance."},{"t":"p","text":"Dr. Heidi, MD, emphasizes, “In today’s competitive business landscape, investing in employee health is not just a benefit, it’s a necessity. Our Corporate Wellness Services are tailored to help businesses thrive by ensuring their most valuable assets, their employees, are healthy and well-supported.” Ador Mansat, DNP, FNP-C, MBA, BSChE, adds, “Our approach combines cutting-edge medical technology with personalized wellness plans, creating an environment where employees can achieve optimal health and well-being. This not only benefits the individuals but also enhances the overall productivity and success of the business.”"},{"t":"p","text":"About Serenite Wellness Medicine"},{"t":"p","text":"Located in Ontario, California, Serenite Wellness Medicine is a leading provider of holistic wellness services. Serenite’s team, including Dr. Heidi, MD, and Ador Mansat, DNP, FNP-C, MBA, BSChE, is dedicated to delivering personalized care and innovative solutions to promote longevity and vitality. Offerings range from beauty and aesthetic treatments to comprehensive longevity programs and corporate wellness services."},{"t":"p","text":"Ador Mansat Serenite Wellness Medicine +1 909-947-1216 Ador.Mansat@SereniteWellnessMed.com"}]}]},"concepts":{"title":"Key Concepts","group":"info","secs":[{"h":"","parts":[{"t":"p","text":"Discover our key concepts about health."}]},{"h":"Health Is Wealth","parts":[]},{"h":"Importance of Investing in One’s Health","parts":[{"t":"p","text":"Investing in one’s health is a critical aspect of ensuring overall well-being and success. Good health enables individuals to perform their best, personally and professionally (World Health Organization, 2021). Maintaining optimal health requires a commitment to regular exercise, a balanced diet, adequate sleep, and stress management (Centers for Disease Control and Prevention, 2021). These investments in one’s health not only prevent diseases but also contribute to improved physical and mental performance."}]},{"h":"Long-Term Benefits of a Healthy Lifestyle","parts":[{"t":"p","text":"Adopting a healthy lifestyle has numerous long-term benefits, including reduced risk of chronic diseases, increased energy levels, and improved mental health (American Heart Association, 2020). Additionally, maintaining a healthy weight reduces the risk of obesity-related complications, such as diabetes, heart disease, and certain cancers (National Institutes of Health, 2021). Overall, a healthy lifestyle can significantly enhance one’s quality of life and increase life expectancy."}]},{"h":"Health Is Beauty","parts":[]},{"h":"The Connection Between Inner Health and Outer Beauty","parts":[{"t":"p","text":"Inner health and outer beauty are closely intertwined, as optimal health often results in a radiant, youthful appearance (Mukherjee et al., 2006). A balanced diet, adequate hydration, and proper skin care can greatly impact the skin’s health and appearance. Moreover, practicing stress management and engaging in regular exercise can also contribute to a glowing complexion and healthy hair (Wong et al., 2016)."}]},{"h":"The Holistic Approach to Achieving a Youthful Appearance","parts":[{"t":"p","text":"A holistic approach to beauty involves caring for the body, mind, and spirit. This includes adopting a nutritious diet, engaging in regular physical activity, practicing stress management techniques, and ensuring adequate sleep (Russo et al., 2020). By focusing on overall well-being, individuals can naturally enhance their appearance and maintain a youthful, vibrant look."}]},{"h":"Health Is Longevity","parts":[]},{"h":"Strategies for Promoting a Long and Healthy Life","parts":[{"t":"p","text":"Promoting a long and healthy life involves a combination of lifestyle choices, including a balanced diet, regular exercise, stress management, and maintaining strong social connections (Kok et al., 2013). Avoiding harmful habits, such as smoking and excessive alcohol consumption, is also crucial for longevity (World Health Organization, 2018). Furthermore, prioritizing preventive healthcare measures, such as regular check-ups and vaccinations, can contribute to a longer, healthier life (American College of Preventive Medicine, 2019)."}]},{"h":"The Role of Preventive Medicine in Longevity","parts":[{"t":"p","text":"Preventive medicine plays a significant role in promoting longevity by identifying and addressing potential health issues before they become chronic problems (Centers for Disease Control and Prevention, 2020). Regular screenings, immunizations, and health education are all essential components of preventive medicine. These proactive measures help individuals maintain good health and increase their chances of living long, fulfilling lives."}]},{"h":"Health Is Wellness","parts":[]},{"h":"Integrating Physical, Mental, and Emotional Well-Being","parts":[{"t":"p","text":"Optimal health and wellness encompass physical, mental, and emotional well-being (World Health Organization, 2014). To achieve this balance, individuals must prioritize regular exercise, a balanced diet, stress management, and strong social connections (Mayo Clinic, 2021). Additionally, focusing on personal development, setting realistic goals, and cultivating a positive mindset is vital for overall wellness."}]},{"h":"Balancing Various Aspects of Life for Optimal Health","parts":[{"t":"p","text":"Balancing various aspects of life, including work, personal relationships, leisure activities, and self-care, is crucial for maintaining optimal health (Greenhaus et al., 2003). By fostering harmony in these areas, individuals can achieve a sense of fulfillment and satisfaction. Setting boundaries, engaging in regular self-reflection, and practicing time management can help maintain this balance and promote overall well-being (American Psychological Association, 2020)."}]},{"h":"References","parts":[{"t":"li","text":"American College of Preventive Medicine. (2019). Importance of prevention. https://www.acpm.org/page/Prevention"},{"t":"li","text":"American Heart Association. (2020). Benefits of physical activity. https://www.heart.org/en/healthy-living/fitness/fitness-basics/aha-recs-for-physical-activity-in-adults"},{"t":"li","text":"American Psychological Association. (2020). Finding work-life balance. https://www.apa.org/topics/work-life-balance"},{"t":"li","text":"Centers for Disease Control and Prevention. (2020). Preventive health care. https://www.cdc.gov/healthcommunication/toolstemplates/entertainmented/tips/PreventiveHealth.html"},{"t":"li","text":"Centers for Disease Control and Prevention. (2021). How to prevent chronic diseases. https://www.cdc.gov/chronicdisease/resources/infographic/chronic-diseases.htm"},{"t":"li","text":"Greenhaus, J. H., Collins, K. M., & Shaw, J. D. (2003). The relation between work-family balance and quality of life. Journal of Vocational Behavior, 63(3), 510-531. https://doi.org/10.1016/S0001-8791(02)00042-8"},{"t":"li","text":"Kok, B. E., Coffey, K. A., Cohn, M. A., Catalino, L. I., Vacharkulksemsuk, T., Algoe, S. B., … & Fredrickson, B. L. (2013). How positive emotions build physical health: perceived positive social connections account for the upward spiral between positive emotions and vagal tone. Psychological Science, 24(7), 1123-1132. https://doi.org/10.1177/0956797612470827"},{"t":"li","text":"Mayo Clinic. (2021). Healthy lifestyle: Achieving a healthy work-life balance. https://www.mayoclinic.org/healthy-lifestyle/adult-health/in-depth/work-life-balance/art-20048134"},{"t":"li","text":"Mukherjee, S., Date, A., Patravale, V., Korting, H. C., Roeder, A., & Weindl, G. (2006). Retinoids in the treatment of skin aging: an overview of clinical efficacy and safety. Clinical Interventions in Aging, 1(4), 327-348. https://doi.org/10.2147/ciia.2006.1.4.327"},{"t":"li","text":"National Institutes of Health. (2021). Managing overweight and obesity in adults: Systematic evidence review from the obesity expert panel. https://www.nhlbi.nih.gov/health-topics/managing-overweight-obesity-in-adults"},{"t":"li","text":"Russo, M., Spagnuolo, C., Tedesco, I., Russo, G. L. (2020). Phytochemicals in cancer prevention and therapy: truth or dare? Toxins, 2(4), 517-551. https://doi.org/10.3390/toxins2040517"},{"t":"li","text":"Wong, V. W., Gurtner, G. C., & Longaker, M. T. (2016). Wound healing: A paradigm for regeneration. Mayo Clinic Proceedings, 88(9), 1022-1031. https://doi.org/10.1016/j.mayocp.2013.05.024"},{"t":"li","text":"World Health Organization. (2014). Mental health: A state of well-being. https://www.who.int/news-room/fact-sheets/detail/"}]}]},"location":{"title":"Location and Hours","group":"info","secs":[{"h":"","parts":[{"t":"item","label":"STRICTLY BY APPOINTMENT ONLY.","text":"NO WEEKENDS, NO HOLIDAYS."}]}]},"book":{"title":"Book an Appointment","group":"info","secs":[{"h":"","parts":[{"t":"p","text":"To streamline the booking process, we’ve designed a simple two-step system to ensure your appointment is confirmed swiftly and efficiently."},{"t":"p","text":"Step 1: Please message us below with at least two options for your preferred date and time availability. Step 2: Bell Mansat our admin will be contacting you by phone from 909-947-1216 to confirm your appointment."}]}]},"privacy":{"title":"Privacy Policy","group":"info","secs":[{"h":"","parts":[{"t":"p","text":"Effective Date: May 2024"},{"t":"p","text":"Welcome to Serenite Wellness Medicine (“we,” “us,” or “our”). We are committed to protecting your privacy and ensuring the security of your personal information. This Privacy Policy outlines how we collect, use, share, and safeguard your data when you use our services. By using our services, you consent to the practices described in this Privacy Policy."}]},{"h":"Information We Collect","parts":[{"t":"p","text":"We may collect the following types of information when you use our website creation services:"},{"t":"li","text":"Personal Information: We may collect personal information, including your name, email address, phone number, and business information when you sign up for our services or communicate with us."},{"t":"li","text":"Payment Information: We may collect payment data for purchases, orders, or service requests, including valid credit card numbers, brands, and expiration dates. We store only very limited, if any, payment information (e.g. payment accounts, bank accounts, credit cards, or cheques) that we collect. Otherwise, all financial information is stored by our payment processor, and you are encouraged to review their privacy policy and contact them directly for responses to your questions."},{"t":"li","text":"Website Information: In creating websites, we may collect content, images, and other materials provided by you to design and customize your website."},{"t":"li","text":"Technical Information: We collect information related to your website’s usage, such as IP addresses, browser type, and access times."},{"t":"li","text":"Cookies and Tracking Technologies: We use cookies and similar technologies to track user behavior on our website. You can manage your cookie preferences through your browser settings."}]},{"h":"How We Use Your Information","parts":[{"t":"p","text":"We use your information for the following purposes:"},{"t":"li","text":"Website Creation: We use your provided data and materials to create and customize websites according to your specifications."},{"t":"li","text":"Communication: We use your contact information to respond to your inquiries, provide support, and keep you updated on the progress of your website project."},{"t":"li","text":"Improvement of Services: We may use your website usage data to enhance and optimize our services and user experience."},{"t":"li","text":"Legal Compliance: We process your data to comply with legal obligations and protect our rights."}]},{"h":"How We Share Your Information","parts":[{"t":"p","text":"We may share your information with third parties under the following circumstances:"},{"t":"li","text":"Service Providers: We may share your data with third-party service providers who assist us in delivering our services, such as hosting providers, domain registrars, and payment processors. These providers are contractually obligated to protect your data."},{"t":"li","text":"Legal Requirements: We may disclose your information if required by law or to protect our rights, privacy, safety, or property."}]},{"h":"Security of Your Information","parts":[{"t":"p","text":"We take appropriate measures to protect your personal information from unauthorized access, disclosure, alteration, or destruction. We use encryption, access controls, and regular security assessments to safeguard your data."}]},{"h":"Your Choices and Rights","parts":[{"t":"li","text":"Access and Correction: You have the right to access and correct your personal information. You can do this by contacting us at 909-947-1216."},{"t":"li","text":"Opt-Out: You can opt out of receiving promotional communications from us at any time by following the instructions provided in the communication."}]},{"h":"Changes to this Privacy Policy","parts":[{"t":"p","text":"We may update this Privacy Policy from time to time to reflect changes in our practices or for legal reasons. We will notify you of any significant changes via email or a notice on our website."}]},{"h":"Contact Us","parts":[{"t":"p","text":"If you have any questions or concerns regarding this Privacy Policy, please contact us at 909-947-1216."}]}]},"t-heidi":{"title":"Dr. Heidi Regenass, MD","group":"team","secs":[{"h":"","parts":[{"t":"img","src":"img/o/dr-heidi-regenass-1-380f7.jpg","alt":"Dr. Heidi Regenass, MD"}]},{"h":"Dr. Heidi Regenass, MD","parts":[{"t":"p","text":"Dr. Heidi Regenass is the founder and medical director of Serenite Wellness Medicine. With over two decades of experience in the field, Dr. Regenass is an expert in integrative and functional medicine, committed to providing compassionate, personalized care that addresses each patient's unique needs and goals. Her philosophy emphasizes the importance of understanding the interconnectedness of the body, mind, and spirit to create a comprehensive approach to healthcare."}]},{"h":"Background and Education","parts":[{"t":"p","text":"Dr. Heidi Regenass is a double-board certified regenerative plastic surgeon with over two decades of experience in integrative and functional medicine. She is a Mayo Clinic-trained surgeon. Driven by a passion for holistic healthcare, Dr. Regenass has honed her skills in integrative and functional medicine, nutrition, and anti-aging therapies to provide her patients with comprehensive care that addresses the root causes of illness."},{"t":"item","label":"Experience and Expertise","text":"Throughout her career, Dr. Regenass has specialized in patient-centered holistic medicine. Her diverse experience has allowed her to develop a deep understanding of the unique healthcare needs of individuals from all walks of life. Dr. Regenass specializes in regenerative plastic surgery, including anti-aging medicine and aesthetic treatments."},{"t":"item","label":"Approach to Wellness and Patient Care","text":"Dr. Regenass is committed to providing compassionate, personalized care to each patient who walks through the doors of Serenite Wellness Medicine. Her approach to wellness is rooted in the belief that the body, mind, and spirit are interconnected and that true health is achieved when all aspects of an individual’s life are balanced. She works closely with her patients to develop customized wellness plans that address their unique needs and goals, combining the best of conventional and integrative medicine to promote optimal health and well-being."}]},{"h":"Publications and Media Appearances","parts":[{"t":"p","text":"As a leader in the field of integrative anti-aging medicine, Dr. Heidi Regenass has contributed to scientific publications and media outlets, sharing her expertise and passion for holistic healthcare with a broader audience. She has authored articles on topics ranging from nutrition and exercise to hormone therapy and anti-aging treatments, helping to educate patients and healthcare professionals on the latest advancements in the field. Dr. Regenass has also made several media appearances, including interviews on television and syndicated podcasts, where she has discussed her approach to healthcare and provided insights into the benefits of a holistic approach to well-being."}]},{"h":"Reach Us Now","parts":[{"t":"p","text":"Contact us today to experience our personalized and holistic approach to wellness. Your well-being is our priority!"}]}]},"t-ador":{"title":"Ador Mansat, DNP, FNP-C, MBA, BSChE","group":"team","secs":[{"h":"","parts":[{"t":"img","src":"img/o/dr-ador-mansat-8ea38.jpg","alt":"Ador Mansat"}]},{"h":"Ador Mansat, DNP, FNP-C, MBA, BSChE","parts":[{"t":"p","text":"Ador Mansat, DNP, FNP-C, MBA, BSChE, is a distinguished and licensed Family Nurse Practitioner who is a straight A student and graduated with the highest honor (4.0 GPA) with a Doctor of Nursing Practice degree from the prestigious South University here in the US. \"Ador\" as he is fondly called, is renowned for his dedication to promoting health and wellness with an emphasis on longevity and vitality. With more than 18 years healthcare experience which includes ICU bedside clinical experience along with his 18 years chemical engineering, business management, and business ownership experience, Ador likes to be called “the BUILDER” and possesses the very rare combination of being an Engineer and a Primary Healthcare Practitioner. He is a life-long learner with multiple University and College degrees (a DNP, an MSN, an MBA, a BSN, a BSChE, an ADN, and an LVN degree). As “the BUILDER\", Ador is a Healthcare Practitioner licensed in several states including California, and a life-long \"Entrepreneur\" whose passion is building businesses including a COVID-19 testing and treatment clinic."}]},{"h":"Family Heroes and Remarkable Career","parts":[{"t":"p","text":"Ador together with his wife Bel, brother Arnold, son Matthew, and sister-in-law Romella, are all heralded as unsung heroes of the recent COVID-19 pandemic. They all risked their lives and health by personally going into many facilities to test, vaccinate, and treat our protected institutionalized population. Ador together with his close family and friends are part of the rare cadre of nurses and doctors who unselfishly risk their lives in service of their countrymen during the COVID pandemic. A Filipino-American with deeply-seated roots in the Philippines, Ador is a proud and top Chemical Engineering graduate of the Mapua Institute of Technology in the Philippines, known as Asia’s MIT."},{"t":"p","text":"In fact, Ador was a Professor at “Asia’s MIT” before he became a Board top-notcher and was recruited by several Fortune 500 companies and eventually headed the South East Asian operation of a big multinational company based here in the US. After retiring from his engineering and corporate jobs, Ador reinvented himself by studying in the US starting with a nursing professional degree and eventually culminating with the highest doctoral degree of his chosen healthcare profession. Being a life-long learner and an avid Mapuan, Ador continues to grow and evolve into a premiere longevity and wellness expert. Together with Dr. Heidi and his brother Arnold, Ador founded Serenite Wellness Medicine Medical Clinic."},{"t":"p","text":"With a deep-seated passion for helping individuals \"Live Younger, Longer\" (LYL), Ador has now become a pivotal figure in the field of wellness medicine. His recent personal achievement of losing 37 pounds himself underscores his commitment not only to his own health but also serves as an inspiring example of the effectiveness of his medical weight loss and management methods. As a scientific author, Ador has written a very popular, widely-implemented, and well-received DNP Capstone scientific paper on the novel combination of the GLP-1 semaglutide medication with Intermittent Fasting (IF) for weight loss and management. With the launch of his Serenite Wellness Medicine medical clinic mobile App, he is now scaling-up the basic premises of his Serenite Wellness Medicine medical clinic practice."}]},{"h":"Innovative Success","parts":[{"t":"p","text":"As one of the founders and sitting at the helm of Serenite Wellness Medicine medical clinic's daily operation, Ador has developed and implemented a proprietary weight loss and management program, which has garnered significant attention for its innovative approach and remarkable success rates. This program is reflective of Ador's holistic view on health care, integrating the latest in medical science and engineering (particularly Artificial Intelligence, fondly referred to nowadays as AI) with personalized care to achieve optimal health outcomes. “High-Tech with High-Touch” is how Ador calls this novel approach to his medical clinic."},{"t":"item","label":"Expertise and Leadership","text":"Ador's expertise and leadership in wellness medicine are grounded in a strong academic background, extensive clinical experience, and a fervent belief in the power of the latest medical science and engineering technology especially in proactive and preventative care. Through his work at Serenite Wellness Medicine medical clinic, he continues to make significant strides in assisting individuals to achieve their health goals, emphasizing sustainable lifestyle changes and proactive health management strategies. His approach is characterized by a compassionate and patient-centered philosophy, ensuring that every patient receives tailored care designed to meet their unique health needs. Ador's dedication to his profession and his patients is evident in his continuous pursuit of excellence and innovation in health and wellness. As a published scientific author, Ador’s Doctor of Nursing Practice (DNP) Capstone Project paper “The Combination Use Of Semaglutide And Intermittent Fasting For Weight Loss” can be found in the Journal of the Academy of Doctoral Prepared Nurses (JADPN). Here is the link: https://www.doctorsofnursingpractice.org/wp-content/uploads/project_form/abstract_140324075129.pdf."}]},{"h":"Transformative Programs","parts":[{"t":"p","text":"Together with his partner and colleague, Dr. Heidi Regenass, MD; Ador Mansat, DNP, FNP-C, MBA, BSChE, at Serenite Wellness Medicine, have developed the 8-Weeks LYL (Live Younger Longer) Challenge which is the centerpiece of the Serenite Wellness Medicine medical clinic’s Corporate Wellness Program (CWP) and Family and Friends Wellness Program (F&FWP)."}]},{"h":"Reach Us Now","parts":[{"t":"p","text":"Contact us today to experience our personalized and holistic approach to wellness. Your well-being is our priority!"}]}]},"t-bel":{"title":"Admin Bel, MBA","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"t-arnold":{"title":"RN Arnold, Clinical Director","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"t-romella":{"title":"LVN Romella, Clinical Director","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"t-donna":{"title":"RN Donna, Master Injector","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"t-ron":{"title":"RN Ron, Clinician","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"t-ninette":{"title":"RN Ninette, Clinician","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"t-myrtle":{"title":"LVN Myrtle, Clinician","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"t-matthew":{"title":"MA Matthew","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"t-josh":{"title":"MA Josh","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"t-joyce":{"title":"MA Joyce","group":"team","secs":[{"h":"","parts":[{"t":"p","text":"We are still updating our website with contents. Please check back next time."}]}]},"o-morpheus8":{"title":"Morpheus8","group":"orig","secs":[{"h":"","parts":[{"t":"img","src":"img/o/morpheus8-sec1-img-1-42de4.jpg","alt":"skin treatment session"},{"t":"img","src":"img/o/morpheus8-sec1-img-2-c301b.jpg","alt":"skin treatment session"}]},{"h":"Welcome to the Future of Skin Rejuvenation: Morpheus8 by InMode at Serenite Wellness Medicine Medical Clinic","parts":[{"t":"p","text":"Transform your skin with Morpheus8, the premier microneedling and fractional radiofrequency treatment that targets the deeper layers of the skin to promote collagen production and remodel your skin’s building blocks. Whether you’re looking to rejuvenate your face or transform your body, Morpheus8 offers tailor-made solutions for every need. Celebrities love it!"}]},{"h":"What Does Morpheus8 Do?","parts":[{"t":"p","text":"Morpheus8 is a cutting-edge skin rejuvenation technology that combines microneedling with fractional radiofrequency (RF) energy to stimulate collagen production deep within the skin. This non-surgical treatment penetrates the deeper layers of the skin, remodeling and rejuvenating it from within. Here’s what Morpheus8 achieves:"},{"t":"item","label":"Reduces Wrinkles and Fine Lines","text":"By targeting the deeper layers of skin, Morpheus8 helps in smoothing out aging signs."},{"t":"item","label":"Tightens Sagging Skin","text":"It boosts the natural production of collagen, leading to tighter and firmer skin."},{"t":"item","label":"Improves Skin Texture","text":"Effective in reducing acne scars and other textural irregularities for a smoother complexion."},{"t":"item","label":"Safe for All Skin Tones","text":"Uses color blind technology, making it safe and effective for all skin types without risk of hyperpigmentation."},{"t":"p","text":"BOTTOMLINE: Morpheus8 is an ideal treatment for anyone looking to improve their skin’s appearance without undergoing invasive surgeries. With minimal downtime and discomfort, it’s a favorite for those seeking effective and noticeable results."}]},{"h":"The Morpheus8 Advantage","parts":[{"t":"p","text":"Morpheus8 isn’t just another aesthetic treatment; it’s a revolutionary technology that merges the benefits of microneedling with the deep-seated action of fractional radiofrequency energy. Here’s what makes Morpheus8 stand out:"},{"t":"item","label":"Deep and Safe Penetration","text":"Targets subdermal layers to remodel collagen on the face and body which results in minimal downtime."},{"t":"item","label":"Uniform Effect","text":"Consistent results, with technology that ensures even delivery of energy."},{"t":"item","label":"Minimal Downtime","text":"Get back to your routine quicker with treatment that’s designed for rapid recovery."},{"t":"item","label":"Color Blind Technology","text":"Effective on all skin tones, Morpheus8 safely delivers enhancements without the risk of post-inflammatory hyperpigmentation."},{"t":"img","src":"img/o/morpheus8-sec3-img-2-c13ed.jpg","alt":"skin treatment session"},{"t":"img","src":"img/o/morpheus8-sec3-img-1-d2e13.jpg","alt":"skin treatment session"}]},{"h":"Before and After Gallery","parts":[{"t":"p","text":"Experience the dramatic transformations firsthand through our gallery of before and after photos. Witness how Morpheus8 has helped individuals gain renewed confidence with smoother, tighter, and youthful skin."}]},{"h":"Celebrity Endorsements","parts":[{"t":"p","text":"Discover why celebrities have chosen Morpheus8 as their go-to treatment for non-invasive skin rejuvenation. Stars like [Celebrity Name] swear by Morpheus8 for its effectiveness and reliability. Hear their stories and see their results!"}]},{"h":"Life-Changing Impacts","parts":[{"t":"p","text":"Morpheus8 isn’t just about looking better, it’s about feeling better. Our clients often tell us about the profound impacts on their self-esteem and overall quality of life:"}]},{"h":"Enhanced Skin Appearance","parts":[{"t":"p","text":"Reduction in acne scars, fine lines, and wrinkles."}]},{"h":"Improved Skin Tone and Texture","parts":[{"t":"p","text":"Noticeably smoother and more uniform skin."}]},{"h":"Revitalized Personal Outlook","parts":[{"t":"p","text":"Many clients report increased confidence and a renewed sense of vitality."}]},{"h":"Testimonials","parts":[{"t":"p","text":"Don’t just take our word for it, listen to the stories of those who’ve experienced Morpheus8’s transformative effects:"},{"t":"quote","text":"After my sessions with Morpheus8, I noticed a significant improvement in my skin texture and firmness. It really has changed the way I feel about myself.","by":"Jane D."}]},{"h":"Testimonial: Pain-Free Experience at Serenite Wellness Medicine Medical Clinic","parts":[{"t":"item","label":"Pain-Free Procedure at Serenite","text":"Our clinic uses advanced pain control techniques, including a premium topical numbing cream and the option for laughing gas, to ensure that your Morpheus8 procedure is as comfortable as possible. These methods help alleviate any discomfort, making the treatment experience virtually painless."}]},{"h":"Patient Testimonial on a Pain-Free Morpheus8 Session at our Serenite Wellness Medicine Medical Clinic:","parts":[{"t":"quote","text":"I was initially nervous about the Morpheus8 treatment, but the staff at Serenite Wellness Medicine Medical Clinic (Ador, RNs Arnold and Donna) all reassured me with their thorough explanation of the pain management steps they use. The topical numbing cream and laughing gas made the procedure completely pain-free. I didn’t feel a thing! The care and attention they provided made my experience extremely comfortable and pleasant. The results were fantastic, and I walked out feeling more confident than ever. Serenite isn’t just a clinic; it’s a place where you truly feel pampered and taken cared of.","by":"Samantha L."}]},{"h":"Experience Excellence with Serenite","parts":[{"t":"p","text":"Serenite Wellness Medicine Medical Clinic, at the gentle and expert hands of Dr. Heidi, Ador, RN Arnold, RN Donna, and so many excellent Clinicians, is a recognized Center of Excellence for Morpheus8 treatments. Serenite prioritizes your comfort and satisfaction. Our expert clinicians are equipped with the best tools for pain management, ensuring a pleasant, pain-free experience. From the moment you walk in, you are taken cared of with the utmost professionalism and empathy."}]},{"h":"Pricing and Packages","parts":[{"t":"p","text":"Morpheus8 Face: Starting at $1,200"},{"t":"p","text":"Morpheus8 Neck: Starting at $1,200"},{"t":"p","text":"Morpheus8 Hyperhidrosis (UnderArm): Starting at $1,200"},{"t":"p","text":"Morpheus8 Body: Starting at $2,000 (varies based on BMI)"}]},{"h":"Book Your Consultation","parts":[{"t":"p","text":"Ready to unlock the potential of your skin? Contact us today to schedule a consultation and discover what Morpheus8 can do for you. Our team of experts is ready to tailor a treatment plan that aligns perfectly with your skin care goals."}]}]},"o-attiva":{"title":"Attiva","group":"orig","secs":[{"h":"","parts":[{"t":"img","src":"img/o/attiva-image1-f2174.jpg","alt":"thermographic imaging"},{"t":"img","src":"img/o/attiva-image2-89356.jpg","alt":"a machine"}]},{"h":"Serenite Wellness Medicine Medical Clinic is a Center of Excellence for ATTIVA by Reveal Lasers","parts":[{"t":"p","text":"Serenite Wellness Medicine Medical Clinic is not just a clinic; it's a pioneer in the field of aesthetic medicine, especially known for its expertise in Attiva treatments. Our facility is recognized as a Center of Excellence, reflecting our commitment to providing the highest standard of care with cutting-edge technology. Our expert staff, including Dr. Heidi, MD; Ador, DNP; and RN Arnold, have been trained and certified by Dr. Jack Zamora, MD, himself who is the Medical Director of Attiva by Reveal Lasers. They are among the first skilled clinicians specializing in Attiva on the West Coast, ensuring you receive expert care in a world-class setting."}]},{"h":"Attiva by Reveal Lasers","parts":[{"t":"video","src":"https://www.serenitewellnessmed.com/wp-content/themes/serenitewellnessor854/nh_attiva/videos/attiva-march-madness-final.mp4"}]},{"h":"How Attiva Works","parts":[{"t":"p","text":"Attiva by Reveal utilizes state-of-the-art, patented radiofrequency technology to target deep layers of the skin, stimulating collagen and elastin production. This innovative approach ensures significant improvements in skin tightness and elasticity from the inside out. Attiva is particularly effective for addressing sagging skin, wrinkles, and other signs of aging, offering a non-surgical solution with results comparable to more invasive procedures like a standard face lift and tummy tuck procedures."}]},{"h":"The Advantages of Attiva","parts":[{"t":"item","label":"Non-Surgical Solution","text":"Achieve skin tightening results without the need for surgery."},{"t":"item","label":"Minimal Downtime","text":"Return to your daily activities shortly after the procedure."},{"t":"item","label":"Long-Lasting Results","text":"Enjoy the benefits of rejuvenated, tighter skin for years to come."},{"t":"item","label":"Safe and Effective","text":"Suitable for all skin types and tones."},{"t":"p","text":"Painless Procedure Experience for ATTIVA by Reveal Lasers Performed at Serenite Wellness Medicine Medical Clinic: At Serenite Wellness Medicine Medical Clinic, we ensure that your Attiva treatment is as comfortable as possible. Our skilled clinicians, including Dr. Heidi, Ador, RN Arnold, and RN Donna, use premium numbing cream and laughing gas to create a painless procedure experience. Hear it from our patients:"}]},{"h":"Before and After Gallery","parts":[{"t":"p","text":"See the transformative effects of Attiva through our before and after photo gallery. These images showcase the dramatic improvements in skin tightness and texture achieved by real patients at our clinic."},{"t":"img","src":"img/o/attiva-slide-1-78348.jpg","alt":""},{"t":"img","src":"img/o/attiva-slide-2-62623.jpg","alt":""},{"t":"img","src":"img/o/attiva-slide-3-2425b.jpg","alt":""},{"t":"img","src":"img/o/attiva-slide-4-f3423.jpg","alt":""},{"t":"img","src":"img/o/attiva-slide-5-a84c7.jpg","alt":""},{"t":"img","src":"img/o/attiva-slide-6-6d8d3.jpg","alt":""},{"t":"img","src":"img/o/attiva-slide-7-d4cba.jpg","alt":""}]},{"h":"Life-Changing Impacts and Excellent Patient Testimonials","parts":[{"t":"p","text":"Attiva is more than a cosmetic procedure; it's a gateway to enhanced self-confidence and a better quality of life. Our patients often report feeling rejuvenated and more vibrant post-treatment."},{"t":"img","src":"img/o/attiva-image4-a1b67.jpg","alt":"Skin Structure Enhancement With iRF"},{"t":"img","src":"img/o/attiva-image3-54ca8.jpg","alt":"a woman having a treatment"}]},{"h":"Patient Testimonials","parts":[{"t":"quote","text":"I was amazed at how comfortable the Attiva treatment was at Serenite. The numbing cream and laughing gas made the entire process pain-free. The care from Dr. Heidi, Ador, RN Arnold, RN Donna and their Serenite team was top-notch, making me feel at ease throughout the procedure. The results? Absolutely incredible.","by":"Maria M."},{"t":"quote","text":"The Attiva treatment at Serenite changed my life. Not only does my skin look years younger, but I also feel incredible. It's like turning back the clock.","by":"Michael P."},{"t":"quote","text":"Thanks to Ador and the team, I had a wonderful experience with Attiva. The results exceeded my expectations, and I couldn't be happier!","by":"Rey O."}]},{"h":"More Patient Testimonials","parts":[{"t":"p","text":"Discover the transformative effects of Attiva by Reveal through the experiences of our patients at Serenite Wellness Medicine Medical Clinic. These testimonials reflect the quick, immediate results that can be achieved even on a lunch break, showcasing the power of this non-surgical approach to skin tightening and rejuvenation."}]},{"h":"Face Lift and a Tummy Tuck on My Lunch Break!","parts":[{"t":"quote","text":"I still can't believe it! I came in for an Attiva session at Serenite during my lunch break and walked out feeling like I had a full face lift and tummy tuck, but without any surgery. The procedure was so quick and the results immediate. I was back to work without anyone knowing I had something done. It's incredible!","by":"Jessica"}]},{"h":"Immediate Eyebag Removal: It’s Like Magic!","parts":[{"t":"quote","text":"I've always been self-conscious about my midsection but didn't want to undergo surgery. Discovering Attiva at Serenite was a dream come true. I had a 'tummy tuck' without any surgery, scars, or downtime. The cost was also much more affordable than traditional procedures. I was able to resume my daily routine immediately, feeling more confident than ever.","by":"Mel"}]},{"h":"Transform Your Appearance on Your Schedule","parts":[{"t":"p","text":"These testimonials highlight the efficiency and effectiveness of the Attiva treatment, designed to fit even the busiest of schedules. At Serenite Wellness Medicine Medical Clinic, you can achieve significant cosmetic improvements over a lunch hour, making it perfect for those who seek impactful results without the inconvenience of long recovery periods."},{"t":"p","text":"Ready to experience these remarkable transformations for yourself? Contact Serenite Wellness Medicine Medical Clinic today to schedule a consultation. Let us help you achieve your aesthetic goals quickly and with minimal disruption to your daily life."}]},{"h":"Book Your Consultation Today","parts":[{"t":"p","text":"Are you ready to experience the revolutionary benefits of Attiva? Contact Serenite Wellness Medicine Medical Clinic today to schedule your consultation. Our team is ready to help you achieve your aesthetic goals with this groundbreaking technology."},{"t":"p","text":"APPOINTMENT for ATTIVA by Reveal Lasers IS FULLY BOOKED. CALL the Clinic to LEARN how to be included in the WAITLIST."},{"t":"p","text":"Experience the miracle of immediate results with Attiva at Serenite Wellness Medicine Medical Clinic. Transform your life with no downtime, no scars, and all the gains of cosmetic enhancement."}]}]},"o-hair":{"title":"New Hair Growth with Exosomes","group":"orig","secs":[{"h":"","parts":[{"t":"img","src":"img/o/thumb-2371311607U62amts-76c0e.jpg","alt":"woman during facial filler injections in aesthetic medical clinic"},{"t":"img","src":"img/o/thumb-2450842529U23a761-9c5bf.jpg","alt":"a trichologist doctor drips the serum onto the patient`s hair"}]},{"h":"Discover New Hair Growth with Exosomes: Revolutionize Your Scalp Health","parts":[{"t":"p","text":"Experience the future of hair restoration with our groundbreaking New Hair Growth treatment using Exosomes, starting at just $1,500. This innovative therapy harnesses the power of exosomes to stimulate your scalp, encouraging hair regrowth and enhancing hair density without invasive procedures."}]},{"h":"The Value Proposition of Exosome Hair Growth Treatment","parts":[{"t":"p","text":"Our Exosome Hair Growth treatment offers a state-of-the-art solution for those experiencing hair thinning or loss. Here’s why it stands out."},{"t":"item","label":"Cutting-Edge Technology","text":"Utilizes exosomes, which are extracellular vesicles rich in growth factors and proteins, to naturally stimulate hair follicles."},{"t":"item","label":"Non-Surgical Approach","text":"Avoid the discomfort and downtime associated with surgical hair restoration methods."},{"t":"item","label":"Safe and Effective","text":"Suitable for all hair types and stages of hair loss, this treatment is clinically proven to improve hair density and thickness."},{"t":"item","label":"Quick and Convenient","text":"Sessions are fast and require no downtime, making it easy to fit into a busy schedule."}]},{"h":"Before & After Photos:","parts":[{"t":"img","src":"img/o/AnteAGE_HairB_A_MN_6_HQ_629d5dbf-e8dc-4a-5b03c.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_MN_7_HQ_3225e227-44bc-48-d99a5.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_MN_8_HQ_800x-b2acb.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_MN_9_HQ_800x-cc65e.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_MN_11B_HQ_800x-0d835.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_HMN_HomeHair_1_HQ_93f72e-9c225.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_HMN_HomeHair_2B_HQ_d2f8d-6590c.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_HMN_HomeHair_3A_HQ_2b26d-39fea.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_HMN_HomeHair_4_HQ_499838-a685d.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_MN_1_HQ_4b1fff2a-8ffa-48-2206f.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_MN_2_HQ_2ad15351-6b50-4a-2279c.jpg","alt":""},{"t":"img","src":"img/o/AnteAGE_HairB_A_MN_5B_HQ_f1f7f9dd-61ba-4-08961.jpg","alt":""}]},{"h":"Life-Changing Impacts","parts":[{"t":"p","text":"Exosome Hair Growth treatment is more than just a procedure, it's a transformative experience that brings significant changes to both your appearance and your self-esteem:"},{"t":"item","label":"Boosted Confidence","text":"Regain the full, thick hair of your youth and enjoy the confidence that comes with it. Our clients report a profound increase in self-esteem following their treatments."},{"t":"item","label":"Visible Results","text":"Many users begin to see improvements in hair thickness and coverage within weeks, with continued enhancements over time."},{"t":"item","label":"Enhanced Scalp Health","text":"Beyond promoting hair growth, exosomes help improve the overall health of your scalp, contributing to stronger, healthier hair."},{"t":"item","label":"Long-Term Benefits","text":"With maintenance treatments, the gains in hair density and scalp health can be sustained for years, helping you look and feel your best."},{"t":"img","src":"img/o/thumb-22102133901U2078et-d9e0f.jpg","alt":"side view of young brunette woman on procedure for improvements hair with special injection"},{"t":"img","src":"img/o/thumb-2450842544Uie145s-b9b51.jpg","alt":"oil for stimulating beard hair growth for men, care and restoration structure"}]},{"h":"Client Testimonials","parts":[{"t":"p","text":"Hear from these clients who have experienced the remarkable benefits of Exosomes New Hair Growth treatment:"},{"t":"quote","text":"I started noticing my hair thinning in my early 30s and it really affected my self-image. This exosome treatment has turned things around for me. The results are amazing, my hair hasn't looked this good in years!","by":"Jessica"},{"t":"quote","text":"Seeing my hair come back has been incredible. This treatment not only helped my hair but also changed how I see myself. I'm more outgoing and confident. Thank you for giving me more than just my hair back.","by":"Sam"}]},{"h":"Book Your Consultation Today","parts":[{"t":"p","text":"Are you ready to transform your hair and your life? Contact us today to schedule your consultation and learn more about how our New Hair Growth with Exosomes can help you achieve the lush, healthy hair you deserve. Our expert team is ready to provide personalized care and a treatment plan tailored to your specific needs."},{"t":"p","text":"Rediscover the joy of full, healthy hair with our Exosome Hair Growth treatment. Start your journey to a better, more confident you today!"}]}]},"o-skin":{"title":"Serenite Skin Care Products","group":"orig","secs":[{"h":"","parts":[{"t":"img","src":"img/o/thumb-2127115895-df72b.jpg","alt":"skin care product"},{"t":"img","src":"img/o/thumb-24145648-11150.jpg","alt":"skin care product"}]},{"h":"Serenite Skin Care Products: Naturally Radiant Skin","parts":[{"t":"item","label":"Discover the Power of Serenite Skin Care Products","text":"Serenite Skin Care Products are meticulously crafted to enhance and rejuvenate your skin using the finest natural ingredients. Our products are designed to provide you with a radiant, youthful complexion, promoting overall skin health and beauty. All of our Serenite Skin Care products are made here in the USA and are paraben- and sulfate-free, as well as animal-cruelty-free."}]},{"h":"What Serenite Skin Care Products Can Do for You","parts":[{"t":"p","text":"Serenite Skin Care Products offer a range of benefits:"},{"t":"item","label":"Deep Hydration","text":"Provide intense hydration, leaving your skin soft and supple."},{"t":"item","label":"Anti-Aging","text":"Reduce the appearance of fine lines, wrinkles, and other signs of aging."},{"t":"item","label":"Brightening","text":"Improve skin tone and texture, giving you a luminous glow."},{"t":"item","label":"Nourishing","text":"Enrich your skin with essential vitamins and nutrients for optimal health."},{"t":"item","label":"Calming","text":"Soothe and calm irritated or sensitive skin."}]},{"h":"Advantages of Serenite Skin Care Products","parts":[{"t":"p","text":"Choosing Serenite Skin Care Products comes with numerous advantages:"},{"t":"item","label":"Natural Ingredients","text":"Formulated with natural, high-quality ingredients that are gentle on your skin."},{"t":"item","label":"Effective Results","text":"Deliver noticeable improvements in skin health and appearance."},{"t":"item","label":"Cruelty-Free","text":"Developed without animal testing, adhering to ethical standards."},{"t":"item","label":"Suitable for All Skin Types","text":"Safe and effective for various skin types, including sensitive skin."},{"t":"item","label":"Eco-Friendly","text":"Packaged in environmentally friendly materials, supporting sustainability."}]},{"h":"Life-Changing Impacts","parts":[{"t":"p","text":"Serenite Skin Care Products can have profound effects on your life:"},{"t":"item","label":"Enhanced Confidence","text":"Feel more confident with a radiant, healthy complexion."},{"t":"item","label":"Improved Skin Health","text":"Achieve and maintain optimal skin health with regular use."},{"t":"item","label":"Youthful Appearance","text":"Look younger and more vibrant, boosting your self-esteem."},{"t":"item","label":"Positive Social Interactions","text":"Enjoy compliments on your glowing skin from friends and family."},{"t":"item","label":"Overall Well-Being","text":"Experience improved emotional and mental well-being through enhanced skin care."},{"t":"img","src":"img/o/thumb-162498106-4739b.jpg","alt":"skin care product"},{"t":"img","src":"img/o/thumb-4751995-7bb7e.jpg","alt":"skin care product"}]},{"h":"Testimonials from Satisfied Patients","parts":[{"t":"quote","text":"Serenite Skin Care Products have transformed my skin. My complexion is brighter, and my skin feels incredibly soft and hydrated. I've never felt more confident.","by":"Anna"},{"t":"quote","text":"I've struggled with sensitive skin for years, and Serenite products have been a game-changer. They soothe my skin without any irritation. Highly recommend!","by":"Matthew"},{"t":"quote","text":"The anti-aging serum from Serenite is amazing. I've noticed a significant reduction in fine lines and wrinkles. My skin looks and feels youthful and radiant.","by":"Maria"},{"t":"quote","text":"I love how Serenite uses natural ingredients. My skin has never looked better, and I feel great knowing I'm using products that are good for me and the environment.","by":"Arnold"}]},{"h":"Book Your Consultation","parts":[{"t":"p","text":"Discover the transformative power of Serenite Skin Care Products and embark on your journey to naturally radiant skin. Explore our range and find the perfect products for your skincare needs today."}]}]},"_home":{"cardImgs":["img/o/btm1-2382911532U93e46s-bcc07.jpg","img/o/btm1-2381611346U1is0e2-e1a5f.jpg","img/o/btm1-2310524928Ue26ias-a0325.jpg","img/o/btm1-236542772-a336a.jpg","img/o/btm1-22110315235U85e14t-f8750.jpg","img/o/btm1-2222192824U56470a-e8b5b.jpg","img/o/btm1-24527112835Ua01547-08c47.jpg","img/o/btm1-449403043-3c7ee.jpg","img/o/btm1-231221110527U273tes-7b929.jpg","img/o/btm1-22102133936U938a61-a9ca0.jpg","img/o/btm1-21111514635Ue2853i-fea6c.jpg","img/o/btm1-2411110211U3m57se-248a1.jpg","img/o/btm1_box_img11-3b09c.jpg","img/o/btm1-23410111609Us274i0-11399.jpg","img/o/btm1_box_img2-86f53.jpg","img/o/btm1-23103123810U65a1s7-7bfc3.jpg","img/o/btm1_box_img3-1e685.jpg","img/o/btm1-2221713344U52aei7-0d242.jpg","img/o/btm1-2172633150U794m53-f2a77.jpg","img/o/btm1-22209122902Us9m0a3-d6b32.jpg","img/o/btm1-2172644928U2m6i0s-71e93.jpg","img/o/btm1-2172630320U435t70-0321c.jpg"],"celebs":[["img/o/btm3_box1-4738f.jpg","Khloe Kardashian"],["img/o/btm3_box2-a290f.jpg","Bella Thorne"],["img/o/btm3_box3-e6f3d.jpg","Jessica Simpson"],["img/o/btm3_box4-6a1ae.jpg","Lisa Rinna"]],"why":["img/o/btm5-img1-ce7fa.jpg","img/o/btm5-img2-f43e3.jpg","img/o/btm5-img3-5358a.jpg","img/o/1-7fad0.jpg","img/o/2-28dd1.jpg"],"misc":{"m8logo":"img/o/morpheus8-logo-bea4f.png","attlogo":"img/o/attiva-logo-20b36.png","seenon":"img/o/logos-1be86.png","qr":"img/o/qr-1f5fd.png","rating":"img/o/footer_rate-12140.jpg","paypal":"img/o/paypal-dbb85.png","mastercard":"img/o/mastercard-3e3a9.png","visa":"img/o/visa-6ad8d.png","discover":"img/o/discover-a837b.png","amex":"img/o/american-express-d5565.png"}}}</script>
